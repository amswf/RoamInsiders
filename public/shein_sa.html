        // --- 1. 兼容性更好的 URL 参数解析与拼接逻辑 ---
        function getQueryParams() {
            var params = {};
            var search = window.location.search.substring(1);
            if (!search) return params;
            var pairs = search.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair[0]) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
                }
            }
            return params;
        }

        // 定义需要提取并透传的参数列表
        const targetParams = ['url_from', 'source_id', 'sub_id', 'campaign_id', 'placement_id', 'network', 'keyword', 'click_id'];
        const currentUrlParams = getQueryParams();
        let queryParts = [];

        // 将当前页面 URL 里的对应参数提取出来，准备拼接到所有跳转链接后面
        targetParams.forEach(function(param) {
            if (currentUrlParams.hasOwnProperty(param)) {
                queryParts.push(encodeURIComponent(param) + '=' + encodeURIComponent(currentUrlParams[param]));
            }
        });

        const queryString = queryParts.join('&');

        // 辅助函数：将参数安全地拼接到目标 URL 后面
        function appendUrlParams(baseUrl) {
            if (!queryString) return baseUrl;
            const separator = baseUrl.indexOf('?') !== -1 ? '&' : '?';
            return baseUrl + separator + queryString;
        }

        // 初始化 Banner 链接 (追加当前页面携带的 URL 宏参数)
        const bannerLinkElement = document.getElementById('banner-link');
        if (bannerLinkElement) {
            bannerLinkElement.href = appendUrlParams(bannerLinkElement.href);
        }

        // --- 2. 统一点击监测逻辑 ---
        function trackClick(goodsId) {

            var trackUrl = "https://insg.jiatoutrade.com/lzd_pb?_jtp_=clk&jtadv=shein&jtpub=jtzjy&devid=__network__&cid=__click_id__&crid=__goods_id__&adgid=__source_id__&camid=__sub_id__";

            // 替换宏
            trackUrl = trackUrl.replace('__network__', encodeURIComponent(currentUrlParams['network'] || ''));
            trackUrl = trackUrl.replace('__click_id__', encodeURIComponent(currentUrlParams['click_id'] || ''));
            trackUrl = trackUrl.replace('__goods_id__', encodeURIComponent(goodsId || ''));
            trackUrl = trackUrl.replace('__source_id__', encodeURIComponent(currentUrlParams['source_id'] || ''));
            trackUrl = trackUrl.replace('__sub_id__', encodeURIComponent(currentUrlParams['sub_id'] || ''));

            // 使用 Image 对象发送 GET 请求（Image Ping），兼容老旧浏览器且不阻塞页面跳转
            var ping = new Image();
            ping.src = trackUrl;
        }

        // 随机打乱商品数组顺序的函数 (Fisher-Yates 洗牌算法)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                // 交换元素
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 每次渲染前，随机打乱商品顺序
        shuffleArray(products);

        // 渲染商品列表
        const gridContainer = document.getElementById('product-grid');
        let htmlContent = '';

        products.forEach(function(product) {
            let productLink = product.link || "https://www.shein.com";
            const finalLink = appendUrlParams(productLink);

            htmlContent += `
                <a href="${finalLink}" target="_blank" onclick="trackClick('${product.goods_id}')" class="bg-white rounded-lg overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.06)] flex flex-col cursor-pointer transition transform hover:scale-[1.01] active:scale-[0.98] block">
